[package]
name = "notemaker"
version = "2.1.0"
description = "Notemaker — daily tasks, notes, habits and a hardware-protected vault"
authors = ["Notemaker contributors"]
license = "MIT"
repository = "https://github.com/more-than-hacking/Notemaker"
edition = "2021"
rust-version = "1.90"

[lib]
name = "notemaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-opener = "=2.7.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
aes-gcm = "=0.11.1"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
getrandom = "=0.4.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(target_os = "linux")'.dependencies]
ctap-hid-fido2 = "=3.6.1"
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "android")'.dependencies]
time = "=0.3.55"

[dev-dependencies]
p256 = { version = "=0.14.0", features = ["ecdh"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
