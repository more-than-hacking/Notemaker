name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  TAURI_DIR: platforms/tauri
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
    libudev-dev rpm patchelf xvfb dbus-x11

jobs:
  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node --test tests-web/
      - name: Hardware-slot test vector is reproducible
        run: |
          node docs/gen-hw-slot-vector.js
          git diff --exit-code docs/hw-slot-test-vector.json

  macos:
    name: macOS tests + app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./Tests-mac/run.sh
      - run: ./build.sh --native-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notemaker-macos-app
          path: build_output/Notemaker.app
          retention-days: 7

  rust:
    name: Rust unit tests + clippy + audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platforms/tauri/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup toolchain install $RUST_VERSION --profile minimal -c clippy && rustup default $RUST_VERSION
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            platforms/tauri/src-tauri/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock') }}
      - run: node ../scripts/prepare-web.mjs
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo audit (RustSec)
        run: |
          command -v cargo-audit || cargo install cargo-audit --version 0.23.0 --locked
          # fails on vulnerabilities; unmaintained/unsound notices (transitive: gtk-rs 0.18, zvariant 5) are printed
          cargo audit

  linux:
    name: Tauri Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup toolchain install $RUST_VERSION --profile minimal && rustup default $RUST_VERSION
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/tauri/src-tauri/target
          key: tauri-linux-${{ matrix.arch }}-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock') }}
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - run: npx tauri build --bundles deb,rpm,appimage
        working-directory: ${{ env.TAURI_DIR }}
        env:
          NO_STRIP: "true"
      - name: Bridge self-test (Xvfb)
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            timeout 180 src-tauri/target/release/notemaker --bridge-selftest | grep -vE "^bridge (←|→)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notemaker-linux-${{ matrix.arch }}
          path: |
            platforms/tauri/src-tauri/target/release/bundle/deb/*.deb
            platforms/tauri/src-tauri/target/release/bundle/rpm/*.rpm
            platforms/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7

  windows:
    name: Tauri Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, bundles: "msi,nsis", selftest: true }
          # WiX 3 (MSI) cannot target ARM64: NSIS only, cross-compiled on the x64 runner
          - { arch: arm64, target: aarch64-pc-windows-msvc, bundles: "nsis", selftest: false }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup toolchain install $env:RUST_VERSION --profile minimal -c clippy; rustup default $env:RUST_VERSION; rustup target add ${{ matrix.target }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platforms/tauri/src-tauri/target
          key: tauri-windows-${{ matrix.arch }}-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock') }}
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - name: Unit tests + clippy (Windows code paths)
        if: matrix.selftest
        working-directory: ${{ env.TAURI_DIR }}/src-tauri
        run: |
          node ../scripts/prepare-web.mjs
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: ${{ env.TAURI_DIR }}
      - name: Bridge self-test
        if: matrix.selftest
        shell: pwsh
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          $env:NOTEMAKER_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "src-tauri\target\${{ matrix.target }}\release\notemaker.exe" -ArgumentList "--bridge-selftest" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content $env:NOTEMAKER_SELFTEST_OUT
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notemaker-windows-${{ matrix.arch }}
          path: |
            platforms/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            platforms/tauri/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 7

  android:
    name: Tauri Android (debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK + Rust targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup toolchain install $RUST_VERSION --profile minimal -c clippy && rustup default $RUST_VERSION
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            platforms/tauri/src-tauri/target
          key: tauri-android-${{ hashFiles('platforms/tauri/src-tauri/Cargo.lock', 'platforms/tauri/src-tauri/gen/android/**/*.kts') }}
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - name: Clippy (Android code paths)
        working-directory: ${{ env.TAURI_DIR }}/src-tauri
        run: |
          node ../scripts/prepare-web.mjs
          cargo clippy --locked --target aarch64-linux-android -- -D warnings
      - run: npx tauri android build --debug --apk --target aarch64 --target x86_64
        working-directory: ${{ env.TAURI_DIR }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notemaker-android-debug
          path: platforms/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
