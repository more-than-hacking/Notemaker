name: Release

# Push a tag like v2.1.0 → builds every platform and publishes a GitHub Release with generated notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"
  TAURI_DIR: platforms/tauri
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
    libudev-dev rpm patchelf xvfb dbus-x11

jobs:
  macos:
    name: macOS universal DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./Tests-mac/run.sh
      - run: ./build_and_create_dmg.sh
      - run: mkdir -p dist-release && cp Notemaker.dmg "dist-release/Notemaker-${GITHUB_REF_NAME}-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist-release/*

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: rustup toolchain install $RUST_VERSION --profile minimal && rustup default $RUST_VERSION
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - run: npx tauri build --bundles deb,rpm,appimage
        working-directory: ${{ env.TAURI_DIR }}
        env:
          NO_STRIP: "true"
      - name: Bridge self-test (Xvfb)
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            timeout 180 src-tauri/target/release/notemaker --bridge-selftest | grep -vE "^bridge (←|→)"
      - name: Collect
        run: |
          mkdir -p dist-release
          B=platforms/tauri/src-tauri/target/release/bundle
          cp $B/deb/*.deb $B/rpm/*.rpm $B/appimage/*.AppImage dist-release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist-release/*

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, bundles: "msi,nsis", selftest: true }
          - { arch: arm64, target: aarch64-pc-windows-msvc, bundles: "nsis", selftest: false }
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: rustup toolchain install $env:RUST_VERSION --profile minimal; rustup default $env:RUST_VERSION; rustup target add ${{ matrix.target }}
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        working-directory: ${{ env.TAURI_DIR }}
      - name: Bridge self-test
        if: matrix.selftest
        shell: pwsh
        working-directory: ${{ env.TAURI_DIR }}
        run: |
          $env:NOTEMAKER_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.txt"
          $p = Start-Process -FilePath "src-tauri\target\${{ matrix.target }}\release\notemaker.exe" -ArgumentList "--bridge-selftest" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content $env:NOTEMAKER_SELFTEST_OUT
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Get-ChildItem "platforms/tauri/src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.msi,*-setup.exe |
            Copy-Item -Destination dist-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist-release/*

  android:
    name: Android (universal APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android NDK + Rust targets
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" "platforms;android-36" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup toolchain install $RUST_VERSION --profile minimal && rustup default $RUST_VERSION
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Release signing key (from secrets; never stored in the repo)
        env:
          KEYSTORE_B64: ${{ secrets.NOTEMAKER_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOTEMAKER_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTEMAKER_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOTEMAKER_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are missing (see platforms/tauri/README.md → Android release key)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "NOTEMAKER_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "NOTEMAKER_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NOTEMAKER_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "NOTEMAKER_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: ${{ env.TAURI_DIR }}
      - run: npx tauri android build --apk --aab
        working-directory: ${{ env.TAURI_DIR }}
      - name: Verify signature + collect
        run: |
          mkdir -p dist-release
          O=platforms/tauri/src-tauri/gen/android/app/build/outputs
          APK=$(ls $O/apk/universal/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" "dist-release/Notemaker-${GITHUB_REF_NAME}-android-universal.apk"
          cp $O/bundle/universalRelease/*.aab "dist-release/Notemaker-${GITHUB_REF_NAME}-android.aab"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist-release/*

  publish:
    name: GitHub Release
    needs: [macos, linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "Notemaker $GITHUB_REF_NAME"
