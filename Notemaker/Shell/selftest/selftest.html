<!doctype html>
<html><head><meta charset="utf-8"><title>Notemaker bridge self-test</title></head>
<body style="font:13px -apple-system;padding:16px"><h3>Notemaker bridge self-test</h3><pre id="out"></pre>
<script>
// Values copied from docs/vault-test-vector.json (recovery slot only).
const VEC = {"recoveryBytes": "EBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCkqKywtLi8=", "vdk": "QEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFlaW1xdXl8=", "slot": {"id": "11111111-1111-4111-8111-111111111111", "type": "recovery", "label": "Recovery key", "createdAt": "2026-11-16T00:00:00Z", "salt": "ICEiIyQlJicoKSorLC0uLw==", "iv": "MDEyMzQ1Njc4OTo7", "ct": "yuTURw62iuPY9QMD2ooFBfVNcPsyejAoHEu32Xf9nc6NTFtKKcdHrFXL0L46AkhX"}, "verifier": {"iv": "AQIDBAUGBwgJCgsM", "ct": "yEUhVUdF3BA82pFsMfN3m9FfsVlOd+K6lM73pF6AC/Q7ig=="}};
const lines = []; let passed = 0, failed = 0;
const log = s => { lines.push(s); document.getElementById("out").textContent = lines.join("\n"); };
const ok = (c, name, extra) => { if (c) { passed++; log("  ✓ " + name + (extra ? " — " + extra : "")); } else { failed++; log("  ✗ " + name + (extra ? " — " + extra : "")); } };
const N = () => window.NotemakerNative;
const req = (m, p) => N().request(m, p);
const rejects = async (m, p, name, expect) => {
  try { await req(m, p); ok(false, name, "did not reject"); }
  catch (e) { ok(!expect || String(e.message).includes(expect), name, "rejected: " + e.message); }
};
const b64 = u8 => btoa(String.fromCharCode(...u8));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const te = new TextEncoder();
const uuid = () => crypto.randomUUID();

async function hkdf(ikm, salt, info) {
  const k = await crypto.subtle.importKey("raw", ikm, "HKDF", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt, info: te.encode(info) }, k, 256));
}
async function gcmOpen(keyBytes, iv, ct, aad) {
  const k = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv, additionalData: te.encode(aad) }, k, ct));
}

async function run() {
  log("Environment");
  ok(!!N() && N().isDesktop === true && N().platform === "macos", "NotemakerNative injected", N() && N().shellVersion);
  ok(Object.isFrozen(N()), "bridge object frozen");
  ok(window.isSecureContext === true, "isSecureContext", String(window.isSecureContext) + " on " + location.protocol);
  ok(!!(window.crypto && crypto.subtle), "crypto.subtle available");
  ok(typeof crypto.randomUUID === "function", "crypto.randomUUID available");

  log("WebCrypto vault vector (recovery slot)");
  try {
    const s = VEC.slot;
    const wrap = await hkdf(unb64(VEC.recoveryBytes), unb64(s.salt), "notemaker/vault/v1/recovery");
    const vdk = await gcmOpen(wrap, unb64(s.iv), unb64(s.ct), "notemaker/vault/v1/slot/" + s.id);
    ok(b64(vdk) === VEC.vdk, "HKDF + AES-GCM unwrap → VDK matches vector");
    const ver = await gcmOpen(vdk, unb64(VEC.verifier.iv), unb64(VEC.verifier.ct), "notemaker/vault/v1/verifier");
    ok(new TextDecoder().decode(ver) === "notemaker-vault-ok", "verifier decrypts");
  } catch (e) { ok(false, "WebCrypto vector", e.message); }

  log("storage.* (temporary data folder)");
  const first = await req("storage.load");
  ok(first && first.json === null, "storage.load on empty folder → null");
  const doc = JSON.stringify({ app: "notemaker", version: 2, tasks: [], notes: {}, marker: "ü✓" });
  ok((await req("storage.save", { json: doc })).ok === true, "storage.save");
  ok((await req("storage.load")).json === doc, "storage.load returns saved JSON (UTF-8 intact)");
  await rejects("storage.save", { json: "not json" }, "storage.save rejects invalid JSON");
  await rejects("storage.save", { json: "[1,2]" }, "storage.save rejects non-object JSON");

  log("blobs.*");
  const id = uuid(), iv = crypto.getRandomValues(new Uint8Array(12)), ct = crypto.getRandomValues(new Uint8Array(1000));
  ok((await req("blobs.put", { id, iv: b64(iv), ct: b64(ct) })).ok === true, "blobs.put");
  const got = await req("blobs.get", { id });
  ok(got && got.iv === b64(iv) && got.ct === b64(ct), "blobs.get round trip");
  ok((await req("blobs.delete", { id })).ok === true, "blobs.delete");
  ok((await req("blobs.get", { id })) === null, "blobs.get after delete → null");
  await rejects("blobs.put", { id: "../../etc/passwd", iv: b64(iv), ct: b64(ct) }, "blobs.put rejects non-UUID id", "UUID");
  await rejects("blobs.put", { id, iv: b64(new Uint8Array(8)), ct: b64(ct) }, "blobs.put rejects 8-byte iv");
  await rejects("blobs.put", { id, iv: b64(iv), ct: "%%%not base64%%%" }, "blobs.put rejects bad base64");

  log("se.* (no Touch ID is triggered)");
  const av = await req("se.available");
  ok(av && typeof av.available === "boolean" && typeof av.device === "string", "se.available", JSON.stringify(av));
  if (av.available) {
    const slotId = uuid();
    const vdk = crypto.getRandomValues(new Uint8Array(32));
    try {
      const slot = await req("se.createSlot", { slotId, label: "Self-test", vdk: b64(vdk) });
      ok(slot.type === "secure-enclave" && slot.id === slotId && slot.label === "Self-test", "se.createSlot returns a secure-enclave keyslot");
      ok(unb64(slot.ephemeralPublicKey).length === 65 && unb64(slot.publicKey).length === 65, "X9.63 public keys are 65 bytes");
      ok(unb64(slot.iv).length === 12 && unb64(slot.ct).length === 48, "slot iv 12 / ct 48 bytes");
      ok(typeof slot.device === "string" && typeof slot.createdAt === "string", "device + createdAt present");
      ok(slot.policy === "user-presence", "default policy user-presence", slot.policy);
      ok((await req("se.deleteSlot", { slotId })).ok === true, "se.deleteSlot");
      await rejects("se.unwrapSlot", { slot }, "se.unwrapSlot after delete → not-this-device", "not-this-device");
    } catch (e) {
      // -25308 = errSecInteractionNotAllowed: macOS refuses Secure Enclave key creation while the Mac is locked.
      if (/-25308/.test(e.message)) log("  ○ se.createSlot — skipped: the Mac is locked (macOS blocks Secure Enclave keys while locked)");
      else ok(false, "se.createSlot", e.message);
    }
  }
  const caps = await req("se.capabilities");
  ok(caps && typeof caps.touchID === "boolean" && typeof caps.enrolled === "boolean", "se.capabilities", JSON.stringify(caps));
  if (av.available) {
    const slotId = uuid();
    try {
      const slot = await req("se.createSlot", { slotId, label: "Touch ID only", vdk: b64(crypto.getRandomValues(new Uint8Array(32))), biometryOnly: true });
      ok(caps.enrolled && slot.policy === "biometry-current-set", "se.createSlot biometryOnly → policy biometry-current-set");
      ok((await req("se.deleteSlot", { slotId })).ok === true, "se.deleteSlot (biometry slot)");
    } catch (e) {
      if (/-25308/.test(e.message)) log("  ○ se.createSlot biometryOnly — skipped: the Mac is locked");
      else ok(!caps.enrolled && e.message === "biometry-unavailable", "se.createSlot biometryOnly without enrolled Touch ID → biometry-unavailable", e.message);
    }
  }
  await rejects("se.createSlot", { slotId: uuid(), label: "x", vdk: b64(new Uint8Array(32)), biometryOnly: "yes" }, "se.createSlot validates biometryOnly", "true or false");
  await rejects("se.createSlot", { slotId: uuid(), label: "x", vdk: b64(new Uint8Array(16)) }, "se.createSlot rejects 16-byte vdk");
  await rejects("se.unwrapSlot", { slot: { id: uuid(), type: "recovery" } }, "se.unwrapSlot rejects non-SE slot");

  log("notify / app / clipboard (non-interactive)");
  const perm = await req("notify.permission");
  ok(perm && ["granted", "denied", "default"].includes(perm.status), "notify.permission", perm && perm.status);
  await rejects("notify.sync", { items: "nope" }, "notify.sync validates items");
  await rejects("notify.sync", { items: [{ id: "x", title: "t", body: "", at: "not-a-date", day: "2026-11-16" }] }, "notify.sync validates at");
  ok((await req("app.setBadge", { count: 0 })).ok === true, "app.setBadge 0");
  ok((await req("app.setFocusTimer", { label: "24:59", phase: "focus" })).ok === true, "app.setFocusTimer show");
  ok((await req("app.setFocusTimer", { label: null })).ok === true, "app.setFocusTimer hide");
  await rejects("app.setFocusTimer", { label: "1", phase: "nap" }, "app.setFocusTimer validates phase");
  await rejects("app.openExternal", { url: "file:///etc/passwd" }, "app.openExternal rejects file://");
  await rejects("clipboard.write", { text: "x", clearAfterSeconds: 0 }, "clipboard.write validates clearAfterSeconds");
  await rejects("no.such.method", {}, "unknown method rejected", "unknown method");

  log("transfer (.notemaker)");
  const nextEvent = (type, trigger) => new Promise((res, rej) => {
    const t = setTimeout(() => { window.removeEventListener("notemaker-native", h); rej(new Error("no " + type + " event")); }, 5000);
    const h = e => { if (e.detail && e.detail.type === type) { clearTimeout(t); window.removeEventListener("notemaker-native", h); res(e.detail); } };
    window.addEventListener("notemaker-native", h);
    trigger();
  });
  try {
    ok((await req("selftest.trigger", { action: "infoPlist" })).ok === true, "Info.plist registers .notemaker document type + UTI com.mth.notemaker.transfer");
    for (const command of ["transfer", "restore", "export", "import"]) {
      const ev = await nextEvent("menu", () => req("selftest.trigger", { action: "menu", arg: command }));
      ok(ev.command === command, "File menu item sends menu “" + command + "”");
    }
    const content = JSON.stringify({ format: "notemaker-transfer", version: 1, note: "self-test ✓" });
    const ev = await nextEvent("openTransfer", () => req("selftest.trigger", { action: "openTransfer", arg: content }));
    ok(ev.fileName === "Selftest transfer.notemaker", "openTransfer fileName", ev.fileName);
    ok(new TextDecoder().decode(unb64(ev.base64)) === content, "openTransfer base64 = file bytes");
  } catch (e) { ok(false, "transfer", e.message); }

  log("integrity (web-manifest.json)");
  const integ = await req("selftest.trigger", { action: "integrity" });
  ok(integ.bundleOK === true, "this app bundle verifies", integ.bundleSummary + ", " + Number(integ.millis).toFixed(1) + " ms");
  ok(integ.millis < 50, "check takes < 50 ms", Number(integ.millis).toFixed(1) + " ms");
  ok(integ.copyOK === true, "fresh manifest of a copy verifies");
  ok(integ.tamperedDetected === true, "tampered file detected (index.html)");
  ok(integ.extraDetected === true, "extra file detected (js/evil.js)");
  ok(integ.symlinkDetected === true, "symlink detected as unexpected");
  ok(integ.missingDetected === true, "missing file detected (app.js)");
  ok(integ.manifestHashDetected === true, "manifest hash mismatch detected");
  ok(integ.restoredOK === true, "restored copy verifies again");
  if (integ.error) ok(false, "integrity self-test", integ.error);

  log("concealed clipboard (private pasteboard — your clipboard is untouched)");
  await rejects("clipboard.write", { text: "x", concealed: "yes" }, "clipboard.write validates concealed", "true or false");
  const clip = await req("selftest.trigger", { action: "clipboard" });
  ok(clip.ok === true, "concealed write: ConcealedType + TransientType markers, auto-clear after 1 s", (clip.types || []).join(", "));

  log("vault state / idle lock / window visibility");
  const collect = async (fn, ms = 300) => {
    const evs = []; const h = e => evs.push(e.detail);
    window.addEventListener("notemaker-native", h);
    try { await fn(); await new Promise(r => setTimeout(r, ms)); } finally { window.removeEventListener("notemaker-native", h); }
    return evs;
  };
  await rejects("app.vaultState", {}, "app.vaultState requires unlocked", "true or false");
  await rejects("app.vaultState", { unlocked: true, autoLockMinutes: 0 }, "app.vaultState validates autoLockMinutes", "out of range");
  ok((await req("app.vaultState", { unlocked: false })).ok === true, "app.vaultState locked");
  let idleRes;
  const idleEvents = await collect(async () => { idleRes = await req("selftest.trigger", { action: "idle" }); });
  const locks = idleEvents.filter(e => e.type === "lock");
  ok(idleRes.timerWhileUnlocked === true && idleRes.timerAfterLock === false, "30 s idle timer runs only while unlocked");
  ok(locks.length === 1 && locks[0].reason === "idle-system", "system idle above the limit → one lock {reason: idle-system}", JSON.stringify(locks));
  ok(typeof idleRes.realIdleSeconds === "number" && idleRes.realIdleSeconds >= 0, "system idle time readable", Number(idleRes.realIdleSeconds).toFixed(1) + " s");
  const winEvents = await collect(() => req("selftest.trigger", { action: "windowEvents" }));
  const vis = winEvents.filter(e => e.type === "windowHidden" || e.type === "windowShown");
  ok(vis.length === 2 && vis[0].type === "windowHidden" && vis[0].reason === "minimized" && vis[1].type === "windowShown",
     "windowHidden {reason} once, then windowShown", JSON.stringify(vis));

  log("events");
  const evt = await new Promise(res => {
    const h = e => { window.removeEventListener("notemaker-native", h); res(e.detail); };
    window.addEventListener("notemaker-native", h);
    window.__notemakerMenuUndo("undo");      // no editable focus → dispatches a menu event
  });
  ok(evt && evt.type === "menu" && evt.command === "undo", "undo outside text field → menu event");
}

run().catch(e => ok(false, "uncaught", e && e.message)).finally(() =>
  N().request("selftest.done", { passed, failed, lines }));
</script></body></html>
