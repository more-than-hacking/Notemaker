<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<g transform="translate(100 100) scale(0.8046875)">
  <!-- Notemaker app icon — original artwork, (c) 2026 More-Than-Hacking (MTH), MIT licensed with the app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="check" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- day page with folded top-right corner -->
  <g filter="url(#shadow)">
    <path d="M300 214 H640 L760 334 V746 a66 66 0 0 1 -66 66 H300 a66 66 0 0 1 -66 -66 V280 a66 66 0 0 1 66 -66 Z" fill="url(#page)"/>
    <path d="M640 214 V300 a34 34 0 0 0 34 34 H760 Z" fill="url(#fold)"/>
  </g>

  <!-- "today" marker -->
  <circle cx="330" cy="318" r="38" fill="#F59E0B"/>
  <circle cx="330" cy="318" r="16" fill="#FDE68A"/>

  <!-- note lines -->
  <rect x="400" y="300" width="190" height="34" rx="17" fill="#C4B5FD"/>
  <rect x="300" y="404" width="380" height="30" rx="15" fill="#DDD6FE"/>
  <rect x="300" y="478" width="300" height="30" rx="15" fill="#DDD6FE"/>

  <!-- bold check that sweeps out past the page edge -->
  <path d="M330 640 L452 752 L800 420" fill="none" stroke="#1E1B4B" stroke-opacity="0.25" stroke-width="104" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 14)"/>
  <path d="M330 640 L452 752 L800 420" fill="none" stroke="url(#check)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
